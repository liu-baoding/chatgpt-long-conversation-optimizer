name: One-shot ChatGPT table copy hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-chatgpt-table-copy-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/one_shot_table_hotfix.py

      - name: Validate JavaScript
        run: node --check chatgpt-latex-copy-enhancer.user.js

      - name: Commit result
        run: |
          rm -f .github/workflows/one-shot-chatgpt-table-copy-hotfix.yml
          rm -f .github/scripts/one_shot_table_hotfix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT table copy scoping and preserve surrounding Markdown"
          git push origin HEAD:main
