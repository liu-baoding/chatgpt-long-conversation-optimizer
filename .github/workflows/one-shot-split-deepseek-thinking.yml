name: Split DeepSeek thinking feature

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-split-deepseek-thinking.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LaTeX userscript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('chatgpt-latex-copy-enhancer.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @version      3.3.0', '// @version      3.3.1', 1)
          s = s.replace('，并为 DeepSeek 自动折叠思考过程', '', 1)

          start = s.index('    const deepSeekThinkingEligibleKeys = new Set();')
          end = s.index('    const SITE_ADAPTERS = [', start)
          s = s[:start] + s[end:]

          old_adapter = "            replyCopyMode: 'deepseek',\n            autoCollapseThinking: true\n"
          new_adapter = "            replyCopyMode: 'deepseek'\n"
          if old_adapter not in s:
              raise SystemExit('adapter block not found')
          s = s.replace(old_adapter, new_adapter, 1)

          old_init = (
              "    if (\n"
              "        ACTIVE_ADAPTER.autoCollapseThinking &&\n"
              "        ACTIVE_ADAPTER.id === 'deepseek'\n"
              "    ) {\n"
              "        installDeepSeekThinkingAutoCollapse();\n"
              "        installDeepSeekThinkingManualButton();\n"
              "    }\n\n"
          )
          if old_init not in s:
              raise SystemExit('init block not found')
          s = s.replace(old_init, '', 1)

          css_start = s.index('        #ai-deepseek-collapse-thinking {')
          css_end_marker = (
              "        #ai-deepseek-collapse-thinking:focus-visible {\n"
              "            outline: 2px solid #4d8dff;\n"
              "            outline-offset: 2px;\n"
              "        }\n"
          )
          css_end = s.index(css_end_marker, css_start) + len(css_end_marker)
          s = s[:css_start] + s[css_end:]

          for token in (
              'deepSeekThinkingEligibleKeys',
              'installDeepSeekThinkingAutoCollapse',
              'installDeepSeekThinkingManualButton',
              'ai-deepseek-collapse-thinking',
              'autoCollapseThinking',
          ):
              if token in s:
                  raise SystemExit('leftover: ' + token)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node --check chatgpt-latex-copy-enhancer.user.js
          node --check deepseek-thinking-collapse.user.js

      - name: Commit
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-split-deepseek-thinking.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove DeepSeek thinking logic from LaTeX enhancer"
          git push origin HEAD:main
