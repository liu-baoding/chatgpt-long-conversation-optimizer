name: One-shot DeepSeek collapse button patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-deepseek-collapse-button.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/scripts/patch_deepseek_button.py

      - name: Validate JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('chatgpt-latex-copy-enhancer.user.js', 'utf8')
            .replace(/^\/\/ ==UserScript==[\s\S]*?^\/\/ ==\/UserScript==\s*/m, '');
          new Function(source);
          console.log('JavaScript syntax: OK');
          NODE

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add manual DeepSeek thinking collapse button"
          git push origin HEAD:main
