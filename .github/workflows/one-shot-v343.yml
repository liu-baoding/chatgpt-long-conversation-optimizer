name: One-shot v3.4.3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v343.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: python .github/scripts/patch_v343.py
      - name: Validate JavaScript
        run: node --check chatgpt-latex-copy-enhancer.user.js
      - name: Commit result
        run: |
          rm -f .github/workflows/one-shot-v343.yml .github/scripts/patch_v343.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT table copy button scoping"
          git push origin HEAD:main
