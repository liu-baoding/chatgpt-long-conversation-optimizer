name: One-shot ChatGPT table copy fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-chatgpt-table-copy-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        shell: bash
        run: python -c "import base64; exec(base64.b64decode(''))"

      - name: Validate JavaScript
        run: node --check chatgpt-latex-copy-enhancer.user.js

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-chatgpt-table-copy-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve Markdown tables in ChatGPT copy"
          git push origin HEAD:main
