name: One-shot v3.4.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v344.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch files
        run: echo '' | base64 -d | python
      - name: Validate JavaScript
        run: node --check chatgpt-latex-copy-enhancer.user.js
      - name: Commit result
        run: |
          rm -f .github/workflows/one-shot-v344.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avoid hijacking ChatGPT code block copy buttons"
          git push origin HEAD:main
