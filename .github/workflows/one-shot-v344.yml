name: One-shot v3.4.4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v344.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('chatgpt-latex-copy-enhancer.user.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('// @version      3.4.3', '// @version      3.4.4', 1)

          def replace_between(text, start_marker, end_marker, replacement):
              a = text.index(start_marker)
              b = text.index(end_marker, a)
              return text[:a] + replacement + text[b:]

          new_context = r'''    function getChatGPTLocalCopyTarget(button) {
        if (!button) return null;

        const stopRoot =
            button.closest('[data-turn-key]') ||
            button.closest(
                '[data-content-search-unit-key$=":assistant"]'
            ) ||
            button.closest(
                '[data-message-author-role="assistant"]'
            );

        const distanceToTopRight =
            (element, buttonRect) => {
                const rect =
                    element.getBoundingClientRect();
                const buttonX =
                    buttonRect.left +
                    buttonRect.width / 2;
                const buttonY =
                    buttonRect.top +
                    buttonRect.height / 2;

                return Math.hypot(
                    buttonX - rect.right,
                    buttonY - rect.top
                );
            };

        let current =
            button.parentElement;
        let depth = 0;

        while (
            current &&
            current !== stopRoot &&
            depth < 12
        ) {
            const tables =
                Array.from(
                    current.querySelectorAll('table')
                );

            /*
             * ChatGPT 的代码块复制按钮通常位于 <pre> 的兄弟/标题区域，
             * 因此 button.closest('pre') 不可靠。这里把当前局部祖先里的
             * pre / data-code-block 也作为可复制对象，与 table 一起判定。
             */
            const codeBlocks =
                Array.from(
                    current.querySelectorAll(
                        'pre, [data-code-block]'
                    )
                ).filter(
                    (element, index, array) =>
                        array.indexOf(element) === index
                );

            if (
                tables.length === 1 &&
                codeBlocks.length === 0
            ) {
                return {
                    kind: 'table',
                    element: tables[0]
                };
            }

            if (
                codeBlocks.length > 0 &&
                tables.length === 0
            ) {
                return {
                    kind: 'code',
                    element: codeBlocks[0]
                };
            }

            if (
                tables.length ||
                codeBlocks.length
            ) {
                const buttonRect =
                    button.getBoundingClientRect();

                const candidates = [
                    ...tables.map(element => ({
                        kind: 'table',
                        element
                    })),
                    ...codeBlocks.map(element => ({
                        kind: 'code',
                        element
                    }))
                ]
                    .map(candidate => ({
                        ...candidate,
                        distance:
                            distanceToTopRight(
                                candidate.element,
                                buttonRect
                            )
                    }))
                    .sort(
                        (a, b) =>
                            a.distance -
                            b.distance
                    );

                /*
                 * 混合内容出现在较高层 ancestor 时，只接受确实靠近按钮的
                 * 对象。否则保持原生复制，绝不猜测为表格按钮。
                 */
                if (
                    candidates[0] &&
                    candidates[0].distance <= 220
                ) {
                    return candidates[0];
                }

                return null;
            }

            current =
                current.parentElement;
            depth += 1;
        }

        return null;
    }

    function findChatGPTTableCopyContext(button) {
        if (
            ACTIVE_ADAPTER.id !== 'chatgpt' ||
            !button ||
            isReplyCopyButton(button)
        ) {
            return null;
        }

        const semanticText = [
            button.getAttribute('aria-label'),
            button.getAttribute('title'),
            button.getAttribute('data-testid'),
            button.textContent
        ]
            .filter(value =>
                typeof value === 'string'
            )
            .join(' ')
            .toLowerCase();

        if (
            !semanticText.includes('copy') &&
            !semanticText.includes('复制')
        ) {
            return null;
        }

        const target =
            getChatGPTLocalCopyTarget(
                button
            );

        /*
         * 只有局部可复制对象明确判定为 table 时才接管。
         * code/pre、未知对象以及回答底部复制全部交还 ChatGPT 原生逻辑。
         */
        if (
            !target ||
            target.kind !== 'table'
        ) {
            return null;
        }

        return {
            button,
            table: target.element
        };
    }

'''
          s = replace_between(
              s,
              '    function findChatGPTTableCopyContext(button) {',
              '    function handleChatGPTTableCopy(event) {',
              new_context,
          )

          p.write_text(s, encoding='utf-8')

          rp = Path('README.md')
          r = rp.read_text(encoding='utf-8')
          marker = '  - v3.4.3：回复底部复制继续保留 ChatGPT 原生完整 Markdown 并仅规范化公式；表格右上角复制则只在局部表格容器内识别按钮，并直接生成该表格的 Markdown + `$...$` 公式，避免与整条回复复制的作用域互相污染\n'
          addition = marker + '  - v3.4.4：表格复制识别同时区分局部 `table` 与代码块 `pre` / `data-code-block`；只有明确命中 table 才接管，代码块复制和其他自带复制按钮保持网站原生行为\n'
          if marker in r:
              r = r.replace(marker, addition, 1)
          rp.write_text(r, encoding='utf-8')
          PY

      - name: Validate JavaScript
        shell: bash
        run: node --check chatgpt-latex-copy-enhancer.user.js

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-v344.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avoid hijacking ChatGPT code block copy buttons"
          git push origin HEAD:main
