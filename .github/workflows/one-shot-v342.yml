name: One-shot v3.4.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-v342.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch files
        run: python .github/scripts/patch_chatgpt_table_copy_v342.py

      - name: Validate JavaScript
        run: node --check chatgpt-latex-copy-enhancer.user.js

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/one-shot-v342.yml
          rm -f .github/scripts/patch_chatgpt_table_copy_v342.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix ChatGPT native copy interception for tables and LaTeX"
          git push origin HEAD:main
